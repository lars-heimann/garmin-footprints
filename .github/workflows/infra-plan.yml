name: OpenTofu Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_turnstile_site_key: ${{ vars.TURNSTILE_SITE_KEY }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.9.0"

      - name: Format check
        run: tofu fmt -check -recursive infra

      - name: Verify GitHub admin token
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets" --silent
          gh api "repos/$GITHUB_REPOSITORY/actions/variables" --silent

      - name: Write OpenTofu backend config
        env:
          STATE_BUCKET: ${{ vars.TOFU_STATE_BUCKET }}
          STATE_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
          STATE_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
        run: |
          cat > infra/prod/backend.hcl <<EOF
          bucket                      = "$STATE_BUCKET"
          key                         = "prod/opentofu.tfstate"
          region                      = "auto"
          endpoint                    = "https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com"
          access_key                  = "$STATE_ACCESS_KEY_ID"
          secret_key                  = "$STATE_SECRET_ACCESS_KEY"
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          use_path_style              = true
          EOF

      - name: Initialize remote state
        run: tofu -chdir=infra/prod init -backend-config=backend.hcl -lockfile=readonly

      - name: Validate
        run: tofu -chdir=infra/prod validate

      - name: Plan
        run: tofu -chdir=infra/prod plan -no-color -input=false -lock-timeout=60s
